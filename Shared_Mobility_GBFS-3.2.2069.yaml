info:
  contact:
    email: doServices.Sirius.Team@deutschebahn.com
    name: the developers
  description: |-
    ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

    ## Info

    * powered by **BusinessHub**
    * in cooperation with **[Deutsche Bahn Connect](https://www.deutschebahnconnect.com/de)**
    * developed with ❤ by **doServices Sirius**


    ## Capabilities

    Shared Mobility GBFS provides bike and station data from Deutsche Bahn Connect as a JSON feed specified in GBFS format.

    The General Bikeshare Feed Specification, known as GBFS, is the open data standard for shared mobility. GBFS makes real-time data feeds in a uniform format publicly available online, with an
    emphasis on findability. [Read more on the GBFS's GitHub page](https://github.com/MobilityData/gbfs/tree/master)


    ## Limitations

    This feed provides GBFS data in **GBFS version 2.3**. It's recommended to use the corresponding [JSON Schema](https://github.com/MobilityData/gbfs-json-schema/tree/v2.3).
    This implementation has custom extensions to the specification (additional fields starting with `_`) which might change without notice.


    ## Authorization

    To use this service, provide credentials via the headers `DB-Api-Key` and `DB-Client-Id` or use the "Try it out" to enter those.


    ## Error-Handling

    If you are using this api and an error occurs, check the examples under *Responses* at each endpoint first or look at the ErrorCode object in the schemas section.
    If you have further question or an unknown error occurred don't hesitate to contact us by [mail](mailto:doServices.Sirius.Team@deutschebahn.com).


    /////////////////////////////////////////// ***doBetter*** /// ***doFaster*** /// ***doServices*** ////////////////////
